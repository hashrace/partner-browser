<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Hashrace popup demo (vanilla)</title>
    <style>
        body { font: 14px system-ui; padding: 24px; max-width: 600px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        #status { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; min-height: 1.5em; }
        #log { margin-top: 8px; background: #111; color: #0f0; font: 12px monospace; padding: 8px; max-height: 240px; overflow: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Hashrace 游戏（popup 模式）</h1>
    <p>点击下方按钮在新窗口启动游戏。与 iframe 嵌入相比，popup 模式让游戏独占
       一个浏览器窗口，不占用 Partner 父页空间——形态对齐 PG SOFT 等行业 popup 启动器。</p>
    <button id="play" disabled>准备中…</button>
    <div id="status">未启动</div>
    <pre id="log"></pre>
    <script type="module">
        // 引用本仓的本地构建产物（先在仓库根目录 `npm ci && npm run build`，见 examples/README.md）。
        // 真实项目里经由打包器 `import { launchInPopup } from '@hashrace/partner-browser'`。
        import { launchInPopup } from '../../dist/index.mjs';

        const play = document.getElementById('play');
        const status = (msg) => { document.getElementById('status').textContent = msg; };
        const log = (msg) => {
            const el = document.getElementById('log');
            el.textContent += msg + '\n';
            el.scrollTop = el.scrollHeight;
        };

        // launchUrl 必须由你自己的后端签发：后端持 API Key 调 Hashrace 的
        // /api/v1/partner/launch-session，再把返回的 URL 交给已登录的玩家页面。
        // 不要从页面 query / hash 里读 launchUrl——那等于让任意链接决定弹窗加载什么（反射型 XSS / 钓鱼）。
        // `/api/hashrace/launch` 是示意路径，换成你后端的实际接口。
        async function fetchLaunchUrl() {
            const res = await fetch('/api/hashrace/launch', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ game_code: 'mines' }),
            });
            if (!res.ok) throw new Error('launch-session failed: HTTP ' + res.status);
            const { launch_url } = await res.json();
            return launch_url;
        }

        // launchInPopup 必须在点击的同步路径里调用（否则被浏览器拦截弹窗），
        // 所以 launch URL 要在点击之前取好；它是一次性的，用掉一次就重新取下一枚。
        let launchUrl = null;
        async function prepare() {
            play.disabled = true;
            play.textContent = '准备中…';
            try {
                launchUrl = await fetchLaunchUrl();
                play.disabled = false;
                play.textContent = '运行游戏';
            } catch (err) {
                status(String(err));
            }
        }

        play.addEventListener('click', () => {
            if (!launchUrl) return;
            const url = launchUrl;
            launchUrl = null;

            const handle = launchInPopup({
                launchUrl: url,
                window: { width: 1280, height: 720 },
                onPopupBlocked: () => {
                    status('弹窗被浏览器拦截，请在浏览器设置中允许本站弹窗后重试');
                    void prepare();
                },
                onSecurityViolation: (reason, detail) => {
                    log('[violation] ' + reason + ' ' + JSON.stringify(detail));
                },
            });
            if (!handle) return;

            play.disabled = true;
            status('游戏窗口已启动');
            log('popup opened');

            handle.on('iframe.ready', (p) => log('iframe ready: ' + JSON.stringify(p)));
            handle.on('iframe.game_ended', (p) => {
                log('game ended: ' + p.game_id);
                handle.close();
            });
            handle.on('iframe.support_request', () => log('support requested: open your support channel'));
            handle.on('iframe.exit_request', (p, ack) => {
                log('iframe wants to exit: ' + p.reason);
                ack({ accepted: true });
            });

            handle.onClosed(() => {
                status('游戏窗口已关闭');
                log('popup closed');
                // 此处可触发回到 Partner 大厅 / 刷新余额
                void prepare();
            });
        });

        void prepare();
    </script>
</body>
</html>
